name: CI

# Build + test on every push and pull request. The separate Live E2E workflow runs heavier
# real-server verification on demand and on a schedule.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Check whitespace
        run: git diff --check

      # `./gradlew build` compiles the newest-version mod + launcher, runs the JUnit suites, and
      # produces the mod jar in build/libs (26.x is unobfuscated, so there is no remap step). It
      # also builds every native per-version module, each of which compiles the shared `common/`
      # source against that release's real Minecraft and remaps a mod jar for it — so a change to
      # `common/` that breaks an older target fails here rather than at runtime.
      - name: Build (compile, JUnit tests, mod jars for every version target, launcher jar)
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            build/libs/*.jar
            versions/*/build/libs/*.jar
            launcher/build/libs/*.jar

  typescript-client:
    name: TypeScript client tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      # `node --test` transpiles without checking types, so a duplicate identifier (a field and a
      # method of the same name, say) ran green for as long as nobody called it. Typecheck first.
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  version-matrix:
    name: Verify Minecraft version matrix pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      # Every release in minecraft-versions.json must exist in Mojang's manifest, and the client
      # pins (Fabric API, ViaFabricPlus, Baritone) must still resolve for the client version.
      - run: ./gradlew verifyVersionMatrix --no-daemon
