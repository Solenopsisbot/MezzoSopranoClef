# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# Mod metadata
mod_version=0.1.0
maven_group=dev.mezzo
archives_base_name=mezzosopranoclef

# Minecraft / Fabric toolchain
# The client is built against ONE Minecraft release: the newest one. Older servers (down to
# 1.7.2, and everything in the 1.12.2..26.2 support matrix) are reached through ViaFabricPlus,
# which translates the protocol on the client side. See minecraft-versions.json.
# 26.x ships unobfuscated, so there are no Yarn mappings: Mojang's own names are used directly.
# Verified against meta.fabricmc.net + api.modrinth.com on 2026-09-06.
minecraft_version=26.2
loader_version=0.19.5
fabric_api_version=0.159.0+26.2

# Baritone (auto-downloaded from GitHub releases; bundled into the jar via jar-in-jar).
# Set bundle_baritone=false to build without it. 1.19.x is the Baritone line for Minecraft 26.2.
baritone_version=1.19.0
bundle_baritone=true

# ViaFabricPlus (client-side protocol translation: lets this 26.2 client join servers running
# any release back to 1.7.2). Pulled from the Modrinth maven for `runClient` and downloaded by
# the standalone launcher on first run. It is GPL-3.0, so it is NOT folded into our MIT jar;
# install it alongside the mod. Set with_viafabricplus=false to run without it.
viafabricplus_version=4.6.3
with_viafabricplus=true
