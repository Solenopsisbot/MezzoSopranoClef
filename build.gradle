plugins {
    // `net.fabricmc.fabric-loom` is the unobfuscated-Minecraft flavour of Loom (26.1+): no
    // Yarn/intermediary, no remapping. Plain `implementation`/`runtimeOnly` replace the old
    // `modImplementation`/`modRuntimeOnly`, and `jar` is the final artifact (no `remapJar`).
    id 'net.fabricmc.fabric-loom'
    id 'java'
}

// ---------------------------------------------------------------------------
// Source layout: `common/` holds every class that compiles unchanged against ANY supported
// Minecraft version (control plane, schema, auth, software renderer, config, Baritone bridge,
// ViaFabricPlus bridge). Each version target — this root project for the newest release, and
// each `versions/<loader>-<mc>` module for older ones — adds only the Minecraft-facing glue and
// its mixins on top. That is what makes per-version mod support possible: every target is a real
// mod jar built against that release, not a protocol shim.
// ---------------------------------------------------------------------------
sourceSets {
    main {
        java.srcDirs = ['src/main/java', 'common/src/main/java', 'fabric-common/src/main/java']
        resources.srcDirs = ['src/main/resources', 'common/src/main/resources']
    }
}

base { archivesName = project.archives_base_name }
version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    // Baritone bundles nether-pathfinder (elytra) as a nested jar. In a production install that
    // nested jar loads fine, but Loom's *dev* runtime doesn't extract nested jars, so we add it
    // explicitly here for `runClient` (otherwise Baritone's startup init NoClassDefFounds).
    maven { name = 'Babbaj'; url = 'https://babbaj.github.io/maven/' }
    // ViaFabricPlus is published on the Modrinth maven (group `maven.modrinth`, artifact = slug).
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup('maven.modrinth') }
    }
    // Auto-download Baritone straight from its GitHub release assets (no maven publishes the
    // current build). We use the UNoptimized fabric jar on purpose: the "standalone" build
    // obfuscates the public baritone.api.* package, which would break our reflective bridge.
    exclusiveContent {
        forRepository {
            ivy {
                name = 'BaritoneGitHubReleases'
                url = uri('https://github.com/cabaletta/baritone/releases/download/')
                patternLayout { artifact('v[revision]/[artifact]-[revision](.[ext])') }
                metadataSources { artifact() }
            }
        }
        filter { includeGroup('baritone-dist') }
    }
}

loom {
    runs {
        // `gradlew runClient` -> launches the headless bot in dev with auto-downloaded MC.
        client {
            client()
            configName = 'Headless Bot Client'
            // Run profiles: `./gradlew runClient -Pprofile=alice` runs in run-profiles/alice, so
            // that profile keeps its own config (account + auth mode), its own auth-cache.json
            // (refresh token) and its own logs. No -Pprofile => the default `run/` dir (unchanged).
            def clefProfile = project.findProperty('profile')
            if (clefProfile) runDir("run-profiles/${clefProfile}".toString())
            // Headless by default; overridable via -Dmezzoclef.headless=... on the invocation.
            if (System.getProperty('mezzoclef.headless') == null) {
                vmArgs '-Dmezzoclef.headless=true'
            }
            // --- low-footprint JVM tuning -------------------------------------------------
            // A headless no-GL bot has a small (~250-350MB) live set, so cap the heap, keep G1
            // for smooth 20 TPS, dedup the many duplicate strings (registries/NBT), and have G1
            // periodically hand idle memory back to the OS so RSS shrinks while the bot waits.
            // All overridable with -PmaxHeap=... (e.g. -PmaxHeap=512m for tight hosts / big fleets).
            def maxHeap = (project.findProperty('maxHeap') ?: '768m').toString()
            vmArgs "-Xmx${maxHeap}".toString()
            vmArgs '-XX:+UseG1GC',
                   '-XX:MaxGCPauseMillis=50',
                   '-XX:+UseStringDeduplication',
                   '-XX:G1PeriodicGCInterval=15000',          // concurrent idle GC -> hand free heap back to the OS
                   '-XX:MaxMetaspaceSize=256m'
            // Minecraft sizes its worker pool to CPU count; a no-render bot needs only a few, and
            // capping it stops a fleet from spawning (cores-1) x N threads. Tune with -PbgThreads.
            def bgThreads = (project.findProperty('bgThreads') ?: '4').toString()
            vmArgs "-Dmax.bg.threads=${bgThreads}".toString()
            // A plain `-Dmezzoclef.*` on `./gradlew` only reaches the Gradle daemon JVM, NOT the
            // separate JVM Loom forks for the client — so e.g. `runClient -Dmezzoclef.dashboard=true`
            // was silently dropped. Forward every mezzoclef.* system property into the game JVM.
            System.properties.each { k, v ->
                if (k.toString().startsWith('mezzoclef.')) vmArgs("-D${k}=${v}".toString())
            }
            // Uncomment to bind the control plane somewhere other than the default:
            // vmArgs '-Dmezzoclef.ws.host=127.0.0.1', '-Dmezzoclef.ws.port=8731'
        }
    }
}

configurations {
    // The ViaFabricPlus jar, resolved on its own (no transitives: it nests everything it needs).
    viaFabricPlus { transitive = false; canBeConsumed = false }
}

dependencies {
    // 26.x is shipped unobfuscated by Mojang, so there is no `mappings` line: the source is
    // written directly against Mojang's names (see gradle.properties).
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // ViaFabricPlus — client-side ViaVersion. This is what makes one 26.2 client able to join
    // servers on every release back to 1.7.2 (our support matrix is 1.12.2..26.2). It is
    // deliberately NOT a classpath/`include` dependency: it is GPL-3.0 and we are MIT, so the
    // standalone launcher downloads it next to the mod instead of us redistributing it inside our
    // jar, and for dev runs `installViaFabricPlusDev` copies it into the run dir's mods/ (where
    // Fabric Loader also unpacks its ~30 nested jars, which it won't do for classpath mods). The
    // bot talks to it reflectively (see dev.mezzo.clef.version.ProtocolBridge) — no compile dep.
    if (project.findProperty('with_viafabricplus') != 'false') {
        viaFabricPlus "maven.modrinth:viafabricplus:${project.viafabricplus_version}"
    }

    // Baritone — auto-downloaded + bundled (jar-in-jar) by default. The bot drives it
    // reflectively (no compile dependency), so it's runtimeOnly. Toggle with
    // -Pbundle_baritone=false (or in gradle.properties) to ship without it.
    if (project.findProperty('bundle_baritone') != 'false') {
        runtimeOnly "baritone-dist:baritone-unoptimized-fabric:${project.baritone_version}"
        include "baritone-dist:baritone-unoptimized-fabric:${project.baritone_version}"
        // dev-runtime only: Baritone's nested elytra native lib (bundled in prod via JiJ).
        runtimeOnly "dev.babbaj:nether-pathfinder:1.6"
    }

    // NOTE: WebSocket control plane is hand-rolled (RFC6455) over java.net sockets and
    // JSON uses Minecraft's bundled Gson, so there are intentionally NO extra runtime deps.

    // Tests (JUnit 5).
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging { events "passed", "skipped", "failed" }
    // Forward the schema-export flag into the forked test JVM, so
    // `./gradlew test -Dclef.schema.write=true` regenerates clients/schema.json from ApiSchema.
    if (System.getProperty('clef.schema.write') != null) {
        systemProperty 'clef.schema.write', System.getProperty('clef.schema.write')
    }
}

java {
    // Minecraft 26.x requires Java 25. Auto-provisioned by foojay if a local JDK 25 isn't found.
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

// Stage ViaFabricPlus into the dev run dir (run/mods, or run-profiles/<profile>/mods) before
// `runClient`, so the dev client has the same multi-version reach as the launcher-installed one.
// With -Pwith_viafabricplus=false the stale copy is removed instead.
def devRunDir = project.findProperty('profile') ? "run-profiles/${project.findProperty('profile')}" : 'run'
tasks.register('installViaFabricPlusDev') {
    description = 'Copies the pinned ViaFabricPlus jar into the dev run dir mods/ folder.'
    def modsDir = file("${devRunDir}/mods")
    def enabled = project.findProperty('with_viafabricplus') != 'false'
    inputs.files(configurations.viaFabricPlus)
    outputs.file(new File(modsDir, 'viafabricplus.jar'))
    doLast {
        def target = new File(modsDir, 'viafabricplus.jar')
        if (!enabled) {
            if (target.delete()) println "[viafabricplus] disabled — removed ${target}"
            return
        }
        modsDir.mkdirs()
        def jar = configurations.viaFabricPlus.singleFile
        java.nio.file.Files.copy(jar.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        println "[viafabricplus] ${project.viafabricplus_version} -> ${target}"
    }
}
tasks.named('runClient') { dependsOn 'installViaFabricPlusDev' }

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    filesMatching('fabric.mod.json') {
        expand version: project.version,
               minecraft_version: project.minecraft_version,
               loader_version: project.loader_version
    }
}

jar {
    from('LICENSE') { rename { "${it}_${project.archives_base_name}" } }
}

// ---------------------------------------------------------------------------
// runFleet — launch a handful (2-5) of INDEPENDENT headless bots at once.
//
// Minecraft is one-client-per-JVM (MinecraftClient.getInstance() is a global
// singleton), so true multi-account = multiple processes, not threads. This
// task spawns N child client JVMs, each fully isolated:
//   * its own gameDir under run-fleet/<name>/ (separate config, logs, token cache)
//   * its own control-plane port (and dashboard port, if enabled)
//   * its own identity (offline username, or its own Microsoft device-code login)
//
// It reuses the EXACT launch spec configured for `runClient` (classpath, main
// class, JVM args incl. macOS -XstartOnFirstThread, asset dirs), so it tracks
// Loom automatically and never goes stale. A single `runFleet` build owns all
// the children, which sidesteps the Gradle build-lock you'd hit by running
// `./gradlew runClient` N times (it's a long-lived task that never returns).
//
// Usage:
//   ./gradlew runFleet -Pbots=alice,bob,carol
//   ./gradlew runFleet -Pcount=3                          # -> ClefBot1..3
//   ./gradlew runFleet -Pbots=a,b -Pserver=play.example.com:25565
//   ./gradlew runFleet -Pbots=a,b -Pdashboard=true
//   ./gradlew runFleet -Pbots=a,b -Pauth=microsoft -PclientId=<azure-app-id>
//   ./gradlew runFleet -Pbots=a,b -PdryRun               # print plan, launch nothing
//
// Optional -P props: wsPortBase (8731), dashPortBase (8831), dashboard (false),
//   server (host[:port]), auth (offline|microsoft), clientId, token (shared
//   control token; default = each bot keeps its own generated one).
// Ctrl-C stops the whole fleet.
// ---------------------------------------------------------------------------
// Drop earlier duplicate -Dkey=... args so the LAST one (our per-bot override) wins
// and the command line stays clean. Non -D args (e.g. -XstartOnFirstThread) pass through.
def fleetDedupeJvm(List args) {
    def seen = new HashSet()
    def out = []
    for (int i = args.size() - 1; i >= 0; i--) {
        def a = args[i] as String
        if (a.startsWith('-D') && a.contains('=')) {
            def key = a.substring(2, a.indexOf('='))
            if (!seen.add(key)) continue
        }
        out << a
    }
    out.reverse()
}

def fleetStripGameDir(List args) {
    def out = []
    int i = 0
    while (i < args.size()) {
        def a = args[i] as String
        if (a == '--gameDir' || a == '--gameDirectory') { i += 2; continue }
        out << a
        i++
    }
    out
}

def fleetStop(List procs) {
    procs.each { try { it.proc.destroy() } catch (ignored) {} }
    procs.each { p ->
        try {
            if (!p.proc.waitFor(10, java.util.concurrent.TimeUnit.SECONDS)) p.proc.destroyForcibly()
        } catch (ignored) {
            try { p.proc.destroyForcibly() } catch (ignored2) {}
        }
    }
}

tasks.register('runFleet') {
    group = 'fabric'
    description = 'Launch multiple independent headless bots, one JVM each (see build.gradle header).'
    // configureClientLaunch preps DLI/natives/assets; classes+processResources build the mod
    // itself into build/classes + build/resources (the dev classpath points at those dirs, so
    // without this the bots boot vanilla MC with the mod missing and no control plane binds).
    dependsOn 'configureClientLaunch', 'classes', 'processResources'

    doLast {
        // --- resolve bot names ----------------------------------------------------
        def names = []
        def botsProp = project.findProperty('bots')
        if (botsProp && botsProp.toString().trim()) {
            names = botsProp.toString().split(',').collect { it.trim() }.findAll { it }
        } else if (project.findProperty('count')) {
            int n = project.findProperty('count') as int
            names = (1..n).collect { "ClefBot${it}".toString() }
        }
        if (names.isEmpty()) {
            throw new GradleException(
                "runFleet needs bots. Try:  ./gradlew runFleet -Pbots=alice,bob   (or -Pcount=3)")
        }
        if (names.size() != names.unique(false).size()) {
            throw new GradleException("Duplicate bot names are not allowed: ${names}")
        }

        // --- knobs ----------------------------------------------------------------
        int wsBase    = (project.findProperty('wsPortBase')   ?: '8731') as int
        int dashBase  = (project.findProperty('dashPortBase') ?: '8831') as int
        boolean dashboard = Boolean.parseBoolean((project.findProperty('dashboard') ?: 'false').toString())
        String authMode = (project.findProperty('auth') ?: 'offline').toString().toLowerCase()
        boolean microsoft = authMode in ['microsoft', 'msa', 'online']
        String clientId = project.findProperty('clientId')?.toString()
        def sharedToken = project.findProperty('token')   // may be null (keep per-bot tokens)
        boolean dryRun = project.hasProperty('dryRun')

        String srvHost = null; int srvPort = 25565
        def serverProp = project.findProperty('server')?.toString()
        if (serverProp) {
            def parts = serverProp.split(':')
            srvHost = parts[0]
            if (parts.length > 1) srvPort = parts[1] as int
        }

        // sanity: control + dashboard port ranges must not overlap
        int n = names.size()
        if (dashboard && wsBase < dashBase + n && dashBase < wsBase + n) {
            throw new GradleException(
                "Control ports [${wsBase}..${wsBase + n - 1}] overlap dashboard ports "
                + "[${dashBase}..${dashBase + n - 1}]. Move -PdashPortBase further away.")
        }
        if (microsoft && !clientId) {
            logger.warn("[fleet] auth=microsoft but no -PclientId given; each bot must have "
                + "azureClientId set in its config, or login will fail.")
        }

        // --- single source of truth: the configured runClient launch spec ---------
        def template = tasks.getByName('runClient')   // Loom RunGameTask (a JavaExec)
        def javaExe = template.javaLauncher.isPresent()
            ? template.javaLauncher.get().executablePath.asFile.absolutePath
            : 'java'
        def classpath = template.classpath.files.collect { it.absolutePath }.join(File.pathSeparator)
        def mainClass = template.mainClass.getOrNull()
        if (!mainClass) throw new GradleException("Could not resolve runClient main class from Loom.")

        // JVM args come from three places depending on Loom/Gradle version — collect all.
        def baseJvm = []
        baseJvm += template.jvmArgs.collect { it as String }
        template.jvmArgumentProviders.each { baseJvm += it.asArguments().collect { a -> a as String } }
        template.systemProperties.each { k, v -> baseJvm << "-D${k}=${v}".toString() }

        // Program args (minus any --gameDir; we set our own per bot).
        def baseArgs = []
        baseArgs += template.args.collect { it as String }
        template.argumentProviders.each { baseArgs += it.asArguments().collect { a -> a as String } }
        baseArgs = fleetStripGameDir(baseArgs)

        def baseEnv = [:]
        template.environment.each { k, v -> if (k != null && v != null) baseEnv[k as String] = v as String }

        def authLabel = microsoft ? 'microsoft' : 'offline'
        def dashLabel = dashboard ? ', dashboard' : ''
        println "[fleet] ${dryRun ? 'PLAN for' : 'launching'} ${n} bot(s): ${names.join(', ')} (auth=${authLabel}${dashLabel})"

        def procs = []
        names.eachWithIndex { name, i ->
            int wsPort   = wsBase + i
            int dashPort = dashBase + i
            File gameDir = file("run-fleet/${name}")
            gameDir.mkdirs()
            // Same multi-version reach as runClient: ViaFabricPlus in this bot's mods/.
            if (project.findProperty('with_viafabricplus') != 'false' && !dryRun) {
                File mods = new File(gameDir, 'mods'); mods.mkdirs()
                java.nio.file.Files.copy(configurations.viaFabricPlus.singleFile.toPath(),
                        new File(mods, 'viafabricplus.jar').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }

            def jvm = new ArrayList(baseJvm)
            jvm << "-Dmezzoclef.headless=true"
            jvm << "-Dmezzoclef.ws.port=${wsPort}".toString()
            if (microsoft) {
                jvm << "-Dmezzoclef.auth.mode=microsoft"
                if (clientId) jvm << "-Dmezzoclef.auth.clientId=${clientId}".toString()
            } else {
                jvm << "-Dmezzoclef.auth.mode=offline"
                jvm << "-Dmezzoclef.auth.username=${name}".toString()
            }
            if (dashboard) {
                jvm << "-Dmezzoclef.dashboard=true"
                jvm << "-Dmezzoclef.dashboard.port=${dashPort}".toString()
            }
            if (sharedToken != null) jvm << "-Dmezzoclef.ws.token=${sharedToken}".toString()
            if (srvHost) {
                jvm << "-Dmezzoclef.connect.auto=true"
                jvm << "-Dmezzoclef.connect.host=${srvHost}".toString()
                jvm << "-Dmezzoclef.connect.port=${srvPort}".toString()
            }
            jvm = fleetDedupeJvm(jvm)

            def cmd = []
            cmd << javaExe
            cmd.addAll(jvm)
            cmd << '-cp' << classpath
            cmd << mainClass
            cmd.addAll(baseArgs)
            cmd << '--gameDir' << gameDir.absolutePath
            cmd = cmd.collect { it as String }

            def where = "ws=127.0.0.1:${wsPort}" + (dashboard ? " dash=http://127.0.0.1:${dashPort}" : "")
            if (dryRun) {
                def overrides = jvm.findAll { it.startsWith('-Dmezzoclef.') }
                println "  - ${name}: ${where} dir=${gameDir}"
                println "      java=${javaExe}"
                println "      main=${mainClass}  (classpath: ${template.classpath.files.size()} entries)"
                println "      overrides: ${overrides.join(' ')}"
                return
            }

            def pb = new ProcessBuilder(cmd)
            pb.directory(gameDir)
            pb.environment().putAll(baseEnv)
            pb.redirectErrorStream(true)
            def proc = pb.start()
            procs << [name: name, proc: proc]
            Thread.startDaemon("fleet-${name}") {
                proc.inputStream.eachLine { line -> println "[${name}] ${line}" }
            }
            println "[fleet] ${name}: ${where} dir=${gameDir}"
        }

        if (dryRun) {
            println "[fleet] dry run only — nothing launched."
            return
        }

        // Reap children on Ctrl-C / JVM exit, and on Gradle task cancellation.
        def hook = new Thread({ -> fleetStop(procs) })
        Runtime.runtime.addShutdownHook(hook)
        try {
            while (procs.any { it.proc.isAlive() }) {
                Thread.sleep(500)
            }
            println "[fleet] all bots exited."
        } catch (InterruptedException ignored) {
            println "[fleet] interrupted — stopping fleet."
        } finally {
            try { Runtime.runtime.removeShutdownHook(hook) } catch (ignored) {}
            fleetStop(procs)
        }
    }
}

// ---------------------------------------------------------------------------
// verifyVersionMatrix — sanity-check the support matrix and the client pins.
//   * every release in minecraft-versions.json exists in Mojang's manifest (release type)
//   * the matrix client version == gradle.properties minecraft_version
//   * Fabric API, ViaFabricPlus and Baritone are published for that Minecraft version
// Network access required. This does NOT prove servers are joinable — that's what
// scripts/verify_versions.sh is for; this only catches drift in the data and the pins.
// ---------------------------------------------------------------------------
tasks.register('verifyVersionMatrix') {
    description = 'Checks minecraft-versions.json against Mojang\'s manifest and verifies the client dependency pins resolve.'
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def matrix = slurper.parse(file('minecraft-versions.json'))
        def mc = project.minecraft_version
        if (matrix.client.minecraft != mc) {
            throw new GradleException("minecraft-versions.json client.minecraft=${matrix.client.minecraft} but gradle.properties minecraft_version=${mc}")
        }
        def manifest = slurper.parseText(new URI('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json').toURL().text)
        def releases = manifest.versions.findAll { it.type == 'release' }.collect { it.id }.toSet()
        if (!releases.contains(mc)) throw new GradleException("Client version ${mc} is not a Mojang release")
        matrix.servers.each { entry ->
            if (!releases.contains(entry.version)) throw new GradleException("Matrix server version ${entry.version} is not a Mojang release")
        }
        def statuses = matrix.servers.countBy { it.status }
        println "matrix: ${matrix.servers.size()} server releases (${statuses}) — all present in Mojang's manifest"

        // --- native client builds: every claim must correspond to a module that is really here ---
        def natives = matrix.nativeClients
        if (!natives) throw new GradleException('minecraft-versions.json has no nativeClients')
        def rootMc = project.minecraft_version
        natives.each { entry ->
            def mcv = entry.minecraft.toString()
            if (!releases.contains(mcv)) throw new GradleException("Native target ${mcv} is not a Mojang release")
            if (!(entry.status in ['runtime-verified', 'jar-built'])) {
                throw new GradleException("Native target ${mcv} has unknown status ${entry.status}")
            }
            if (mcv == rootMc) {
                // The newest release is the root project rather than a versions/ module.
                if (entry.module != '(root project)') {
                    throw new GradleException("Native target ${mcv} should be the root project, got ${entry.module}")
                }
            } else {
                // Check the module the entry actually declares. Assuming versions/fabric-<mc> made
                // every NeoForge and Forge entry pass on its Fabric twin's directory — deleting
                // versions/neoforge-1.21.8 would not have failed this check.
                def loader = (entry.loader ?: 'fabric').toString()
                def moduleName = "${loader}-${mcv}"
                def dir = file("versions/${moduleName}")
                if (entry.module && entry.module.toString() != "versions/${moduleName}") {
                    throw new GradleException("Native target ${loader} ${mcv} declares module ${entry.module}, expected versions/${moduleName}")
                }
                if (!dir.isDirectory()) throw new GradleException("Native target ${loader} ${mcv} claims a module that does not exist: ${dir}")
                if (!new File(dir, 'build.gradle').isFile()) throw new GradleException("Native target ${loader} ${mcv} has no build.gradle")
                if (!settingsFileIncludes(moduleName)) throw new GradleException("Native target ${loader} ${mcv} is not included in settings.gradle")

                // The module must also agree with itself about which release it is. This was wrong
                // in 13 modules because the scaffolder copied the donor's constant verbatim, and on
                // Forge it fed ModPlatform.minecraftVersion().
                def caps = new File(dir, "src/main/java/dev/mezzo/clef/version/VersionCapabilities.java")
                if (caps.isFile()) {
                    def declared = (caps.text =~ /MINECRAFT = "([^"]*)"/)
                    if (declared && declared[0][1] != mcv) {
                        throw new GradleException("Native target ${loader} ${mcv} declares MINECRAFT = \"${declared[0][1]}\" in VersionCapabilities")
                    }
                }
            }
        }
        def nativeStatuses = natives.countBy { it.status }
        println "native client builds: ${natives.size()} targets (${nativeStatuses})"

        def head = { String url ->
            def c = new URI(url).toURL().openConnection()
            c.requestMethod = 'HEAD'; c.instanceFollowRedirects = true
            c.setRequestProperty('User-Agent', 'MezzoSopranoClef-build')
            c.responseCode
        }
        def api = project.fabric_api_version
        def apiUrl = "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${api}/fabric-api-${api}.jar"
        if (head(apiUrl) != 200) throw new GradleException("Fabric API ${api} is not published")
        if (!api.endsWith("+${mc}")) throw new GradleException("Fabric API ${api} does not target Minecraft ${mc}")
        println "fabric-api ${api}: published"

        def viaUrl = "https://api.modrinth.com/v2/project/viafabricplus/version/${project.viafabricplus_version}"
        def viaConn = new URI(viaUrl).toURL().openConnection()
        viaConn.setRequestProperty('User-Agent', 'MezzoSopranoClef-build')
        def via = slurper.parseText(viaConn.inputStream.text)
        if (!(via.game_versions.contains(mc))) {
            throw new GradleException("ViaFabricPlus ${project.viafabricplus_version} targets ${via.game_versions}, not ${mc}")
        }
        println "viafabricplus ${project.viafabricplus_version}: published for ${mc}"

        def bv = project.baritone_version
        def baritoneUrl = "https://github.com/cabaletta/baritone/releases/download/v${bv}/baritone-unoptimized-fabric-${bv}.jar"
        if (head(baritoneUrl) != 200) throw new GradleException("Baritone ${bv} fabric jar is not published")
        println "baritone ${bv}: published"
    }
}


/** True when settings.gradle actually wires this native target into the build. */
def settingsFileIncludes(String moduleName) {
    file('settings.gradle').text.contains("include 'versions:${moduleName}'")
}

// Build every native per-version client jar in one go (the root project is the newest release).
tasks.register('buildAllVersions') {
    description = 'Builds the mod jar for every native per-version target plus the newest-release root build.'
    dependsOn 'build'
    dependsOn subprojects.findAll { it.path.startsWith(':versions:') }.collect { "${it.path}:build" }
    doLast {
        def targets = subprojects.findAll { it.path.startsWith(':versions:') }.collect { it.name }
        println "Built native client jars for: ${(['(root) ' + project.minecraft_version] + targets).join(', ')}"
    }
}
