// Native Fabric build for Minecraft 1.21.11.
//
// Unlike the ViaFabricPlus protocol path (one newest-version client talking to old servers), this
// is a REAL client build for 1.21.11: it loads 1.21.11 Fabric mods, because it is a 1.21.11 mod.
// Mojang's official mappings are used here — and on every other target — so a single `common/`
// source tree and one naming scheme span the whole matrix; only genuine Minecraft API changes
// differ between targets, and those live in this module's src/main/java.
plugins {
    // Classic (remapping) Loom: 1.21.11 is still obfuscated, unlike 26.x.
    id 'fabric-loom'
    id 'java'
}

ext {
    mcVersion = '1.21.11'
    fabricApiVersion = '0.141.6+1.21.11'
    loaderVersion = '0.19.5'
    javaMajor = 21
}

group = rootProject.group
version = rootProject.version
base { archivesName = "mezzosopranoclef-fabric-${mcVersion}" }

repositories {
    mavenCentral()
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
}

sourceSets {
    main {
        java.srcDirs = ['../../common/src/main/java', '../../fabric-common/src/main/java',
                        '../mc-1.21.11/src/main/java', 'src/main/java']
        resources.srcDirs = ['../../common/src/main/resources', 'src/main/resources']
    }
}

loom {
    runs {
        // `./gradlew :versions:fabric-1.21.11:runClient` boots the real 1.21.11 client headless.
        client {
            client()
            configName = "Headless Bot Client ${mcVersion}"
            if (System.getProperty('mezzoclef.headless') == null) vmArgs '-Dmezzoclef.headless=true'
            vmArgs "-Xmx${project.findProperty('maxHeap') ?: '768m'}".toString()
            vmArgs '-XX:+UseG1GC', '-XX:MaxGCPauseMillis=50', '-XX:+UseStringDeduplication',
                   '-XX:G1PeriodicGCInterval=15000', '-XX:MaxMetaspaceSize=256m'
            vmArgs "-Dmax.bg.threads=${project.findProperty('bgThreads') ?: '4'}".toString()
            System.properties.each { k, v ->
                if (k.toString().startsWith('mezzoclef.')) vmArgs("-D${k}=${v}".toString())
            }
        }
    }
}

java { toolchain { languageVersion = JavaLanguageVersion.of(javaMajor) } }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaMajor
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', mcVersion
    inputs.property 'loader_version', loaderVersion
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: mcVersion, loader_version: loaderVersion
    }
}
